name: Deploy WFD Money to GitHub Pages

on:
  push:
    branches: [claude/financial-tracking-advice-7y0c7e, main]
    paths: ['WFD-MONEY/**', '.github/workflows/money-pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: WFD-MONEY
      - id: deployment
        uses: actions/deploy-pages@v4
      - run: echo "Deployed to ${{ steps.deployment.outputs.page_url }}"
